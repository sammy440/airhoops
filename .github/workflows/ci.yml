name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: catches drift when a sister repo changes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the detector replay against the lab's fixtures (src/lib/pose/__fixtures__).
      - run: npm test
      - run: npm run build

  backend-parity:
    # The API re-simulates every multiplayer throw with its Python port of the physics.
    # Regenerate the fixtures from this commit's TypeScript and run the API's parity
    # tests against them: fails if physics, launch mapping, scoring or the green rim
    # changed here without the same change in airhoop-api.
    name: Physics parity with the API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airhoops
          POSTGRES_PASSWORD: airhoops
          POSTGRES_DB: airhoops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://airhoops:airhoops@localhost:5432/airhoops_test
    steps:
      # Side by side, as the generator expects (../airhoops-backend).
      - uses: actions/checkout@v4
        with:
          path: airhoops-frontend
      - uses: actions/checkout@v4
        with:
          repository: sammy440/airhoop-api
          path: airhoops-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: airhoops-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: airhoops-backend/pyproject.toml
      - run: npm ci --ignore-scripts
        working-directory: airhoops-frontend
      - name: Regenerate fixtures from this commit
        run: GEN_PARITY=1 npx vitest run src/lib/game/parity.gen.test.ts
        working-directory: airhoops-frontend
      - name: Fixture changes (empty = physics unchanged)
        run: git diff --stat tests/fixtures
        working-directory: airhoops-backend
      - run: pip install -e ".[dev]"
        working-directory: airhoops-backend
      - run: pytest tests/test_physics_parity.py
        working-directory: airhoops-backend
